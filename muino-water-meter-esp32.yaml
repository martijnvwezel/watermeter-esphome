# These substitutions allow the end user to override certain values
substitutions:
  name: "muino-water-meter"
  friendly_name: "Muino Water Meter"
  # These bounds are used to filter out unrealistic readings, adjust as needed based on your sensor
  upper_bound: 3.3
  lower_bound: 0.001
  # Time in milliseconds to reset current consumption and flow rate if no flow is detected. Adjust as needed based on typical flow patterns.
  reset_current_time: 30000
  # If flow drops to less than this fraction of the current flow rate, reset consumption.
  reset_fraction: 0.1
  # Interval between sensor readings
  sample_interval: 100ms
  # Number of samples to take for each reading
  samples_per_reading: 10
  # Total window size (should >= samples_per_reading)
  total_window_size: 30

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # Automatically add the mac address to the name so you can use a single firmware for all devices
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: "dio"

  # This will allow for (future) project identification, configuration and updates.
  project:
    name: esphome.muino-water-meter
    version: "4.0.0"

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

# Make sure logging is correct for solving platform IO bugs
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

# API is a requirement of the dashboard import.
api:

# OTA is required for Over-the-Air updating
ota:
  platform: esphome

# This should point to the public location of this yaml file.
dashboard_import:
  package_import_url: github://martijnvwezel/watermeter-esphome/muino-water-meter-esp32.yaml@main

wifi:
  # Set up a wifi access point using the device name above
  ap:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

# Define entities
switch:
  - platform: template
    optimistic: true
    id: fastupdate
    name: Speed mode
    icon: "mdi:emoticon-cool-outline"
    entity_category: "diagnostic"

  - platform: template
    optimistic: true
    id: debugmodus
    name: Debug mode
    icon: "mdi:bug"
    entity_category: "diagnostic"

  - platform: template
    optimistic: true
    id: manual_calibration
    name: "Manual Calibration"
    icon: "mdi:tune-vertical"
    entity_category: "config"
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true

button:
  - platform: template
    id: reset_calibration
    name: "Reset Calibration"
    icon: "mdi:restart"
    entity_category: "config"
    on_press:
      - lambda: |-
          id(consumption_since_restart) = 0;
          id(consumption_current) = 0;
          id(flow_rate_current) = 0;
          id(min_a).state = 0;
          id(min_b).state = 0;
          id(min_c).state = 0;
          id(max_a).state = 0;
          id(max_b).state = 0;
          id(max_c).state = 0;

text_sensor:
  - platform: template
    id: debug_json
    name: "Debug JSON"
    icon: "mdi:code-json"
    entity_category: "diagnostic"
    update_interval: never

output:
  - platform: gpio
    pin: 7
    id: led
  - platform: gpio
    pin: 6
    id: sensor_power

sensor:
  - &adc_common
    platform: adc
    update_interval: never
    samples: 1
    entity_category: "diagnostic"
    internal: true
    pin:
      number: 2
      allow_other_uses: true
      ignore_strapping_warning: true
    id: light_sensor_a_dark
    name: "Light Sensor A Dark"
    filters:
      - sliding_window_moving_average:
          window_size: ${total_window_size}
          send_every: ${samples_per_reading}
          send_first_at: ${samples_per_reading}

  - <<: *adc_common
    pin:
      number: 3
      allow_other_uses: true
    id: light_sensor_b_dark
    name: "Light Sensor B Dark"

  - <<: *adc_common
    pin:
      number: 4
      allow_other_uses: true
    id: light_sensor_c_dark
    name: "Light Sensor C Dark"

  - <<: *adc_common
    pin:
      number: 2
      allow_other_uses: true
      ignore_strapping_warning: true
    id: light_sensor_a_light
    name: "Light Sensor A Light"

  - <<: *adc_common
    pin:
      number: 3
      allow_other_uses: true
    id: light_sensor_b_light
    name: "Light Sensor B Light"

  - <<: *adc_common
    pin:
      number: 4
      allow_other_uses: true
    id: light_sensor_c_light
    name: "Light Sensor C Light"

  # liters
  - platform: template
    name: "Lifetime Consumption"
    id: consumption_lifetime_sensor
    device_class: "water"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    update_interval: never
    state_class: total_increasing
    lambda: return id(consumption_lifetime);

  - platform: template
    name: "Consumption since restart"
    id: consumption_since_restart_sensor
    device_class: "water"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    update_interval: never
    state_class: total_increasing
    lambda: return id(consumption_since_restart);

  # Flow rate sensors
  - platform: template
    name: "Current Flow Rate"
    id: flow_rate_current_sensor
    device_class: "volume_flow_rate"
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: never
    state_class: measurement
    lambda: return id(flow_rate_current);

  - platform: template
    name: "Previous Flow Rate"
    id: flow_rate_previous_sensor
    device_class: "volume_flow_rate"
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: never
    state_class: measurement
    lambda: return id(flow_rate_previous);

  # Consumption sensors
  - platform: template
    name: "Current Consumption"
    id: consumption_current_sensor
    device_class: "water"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    update_interval: never
    lambda: return id(consumption_current);

  - platform: template
    name: "Previous Consumption"
    id: consumption_previous_sensor
    device_class: "water"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    update_interval: never
    lambda: return id(consumption_previous);

number:
  - platform: template
    id: consumption_lifetime_number
    name: "Lifetime Consumption"
    device_class: "water"
    unit_of_measurement: "L"
    update_interval: never
    restore_value: true
    min_value: 0
    max_value: 1000000000
    step: 0.01
    set_action:
      - lambda: id(consumption_lifetime) = x;

  - &num_common
    platform: template
    id: min_a
    name: "Min A"
    min_value: 0
    max_value: ${upper_bound}
    entity_category: "config"
    device_class: "voltage"
    unit_of_measurement: "V"
    step: 0.001
    update_interval: never
    restore_value: true
    optimistic: true
    disabled_by_default: true

  - <<: *num_common
    id: min_b
    name: "Min B"

  - <<: *num_common
    id: min_c
    name: "Min C"

  - <<: *num_common
    id: max_a
    name: "Max A"

  - <<: *num_common
    id: max_b
    name: "Max B"

  - <<: *num_common
    id: max_c
    name: "Max C"

  - platform: template
    id: update_interval
    name: "Update Interval"
    entity_category: "config"
    device_class: "duration"
    unit_of_measurement: "s"
    update_interval: never
    restore_value: true
    min_value: 1
    max_value: 3600
    step: 1
    optimistic: true

globals:
  # Consumption tracking variables
  - id: consumption_lifetime
    type: double
    initial_value: "0"
    restore_value: true
  - id: consumption_since_restart
    type: double
    initial_value: "0"
  - id: consumption_current
    type: float
    initial_value: "0"
  - id: consumption_previous
    type: float
    initial_value: "0"
    restore_value: true

  # Flow rate tracking variables
  - id: flow_rate_current
    type: float
    initial_value: "0.0"
  - id: flow_rate_previous
    type: float
    initial_value: "0.0"
    restore_value: true

  # other state variables
  - id: last_flow_time
    type: uint32_t
    initial_value: "0"

  - id: last_publish_time
    type: uint32_t
    initial_value: "0"

  - id: phase
    type: int
    initial_value: "0"

# Reads the ADC states, computes the algorithm and updates the sensors. Also handles calibration and filtering.
script:
  - id: update_readings
    then:
      - output.turn_on: sensor_power
      - delay: 20ms
      - repeat:
          count: ${samples_per_reading}
          then:
            - component.update: light_sensor_a_dark
            - component.update: light_sensor_b_dark
            - component.update: light_sensor_c_dark
      - output.turn_on: led
      - delay: 20ms
      - repeat:
          count: ${samples_per_reading}
          then:
            - component.update: light_sensor_a_light
            - component.update: light_sensor_b_light
            - component.update: light_sensor_c_light
      - output.turn_off: led
      - output.turn_off: sensor_power
      - lambda: |-
          auto min_average = [](float _min, float _max, float y, float alpha_cor) -> float {
            if (_min == 0) 
                return y;
            else if (y < _min + 0.10 * (_max - _min))
              return (1.0f - alpha_cor) * _min + alpha_cor * y;
            else 
              return _min;
          };

          auto max_average = [](float _min, float _max, float y, float alpha_cor) -> float {
            if (_max == 0) 
                return y;
            else if (y > _max - 0.10 * (_max - _min)) 
                return (1.0f - alpha_cor) * _max + alpha_cor * y;
            else 
                return _max;
          };

          ESP_LOGD("org", "al:%f bl:%f cl:%f ad:%f bd:%f cd:%f", 
            id(light_sensor_a_light).state, id(light_sensor_b_light).state, id(light_sensor_c_light).state, 
            id(light_sensor_a_dark).state, id(light_sensor_b_dark).state, id(light_sensor_c_dark).state);

          float a = id(light_sensor_a_light).state - id(light_sensor_a_dark).state;
          float b = id(light_sensor_b_light).state - id(light_sensor_b_dark).state;
          float c = id(light_sensor_c_light).state - id(light_sensor_c_dark).state;

          ESP_LOGD("sensor", "al:%f bl:%f cl:%f ad:%f bd:%f cd:%f a:%f b:%f c:%f", id(light_sensor_a_light).state, id(light_sensor_b_light).state, id(light_sensor_c_light).state, id(light_sensor_a_dark).state, id(light_sensor_b_dark).state, id(light_sensor_c_dark).state, a, b, c); 

          if (a==0 || b==0 || c==0) {
            // Initializing, ignore
            return;
          }
          else if (a < ${lower_bound} ||  b < ${lower_bound} || c < ${lower_bound} ) {
            ESP_LOGW("light_level", "Signal too weak. Possible causes: too bright environment, LED failure, or sensor misalignment. Ignoring measurement.");
            return;
          }
          else if (a > ${upper_bound} || b > ${upper_bound} || c > ${upper_bound}) {
            ESP_LOGW("light_level", "Too bright, ignoring this measurement");
            return;
          }

          if (id(manual_calibration).state==false && id(consumption_since_restart) <= 2.0f) {
            // correction factor for min/max averaging, adjust as needed
            // 0.1 is reasonable during calibration, if continuous adjustment is needed, 
            // suggest using 0.001 after calibration
            float alpha_cor = 0.1f; 

            id(min_a).state = min_average(id(min_a).state, id(max_a).state, a, alpha_cor);
            id(min_b).state = min_average(id(min_b).state, id(max_b).state, b, alpha_cor);
            id(min_c).state = min_average(id(min_c).state, id(max_c).state, c, alpha_cor);
            id(max_a).state = max_average(id(min_a).state, id(max_a).state, a, alpha_cor);
            id(max_b).state = max_average(id(min_b).state, id(max_b).state, b, alpha_cor);
            id(max_c).state = max_average(id(min_c).state, id(max_c).state, c, alpha_cor);

            ESP_LOGD("calibration", "a_min:%f b_min:%f c_min:%f a_max:%f b_max:%f c_max:%f",
                      id(min_a).state, id(min_b).state, id(min_c).state,
                      id(max_a).state, id(max_b).state, id(max_c).state);

            if (id(max_a).state - id(min_a).state < 0.02f || id(max_b).state - id(min_b).state < 0.02f || id(max_c).state - id(min_c).state < 0.02f) {
              if (id(consumption_since_restart) >= 2) {
                ESP_LOGW("light_level", "Difference between max and min levels too small for reliable measurement.");
              }
              return;
            }
          }

          // Remove offset and scale to -1..1 range based on min/max
          a = (a - (id(min_a).state + id(max_a).state)/2) / std::max(0.0001f, (id(max_a).state - id(min_a).state)/2);
          b = (b - (id(min_b).state + id(max_b).state)/2) / std::max(0.0001f, (id(max_b).state - id(min_b).state)/2);
          c = (c - (id(min_c).state + id(max_c).state)/2) / std::max(0.0001f, (id(max_c).state - id(min_c).state)/2);

          ESP_LOGD("scaled", "a:%f b:%f c:%f", a, b, c);

          const float H = 0.2f;  // hysteresis margin (3% of full scale)

          // Hysteresis comparisons
          bool a_gt_b = (a > b + H);
          bool b_gt_a = (b > a + H);

          bool b_gt_c = (b > c + H);
          bool c_gt_b = (c > b + H);

          bool c_gt_a = (c > a + H);
          bool a_gt_c = (a > c + H);


          int s = id(phase);  // default: keep previous phase

          if (a_gt_b && b_gt_c) s = 0;
          else if (a_gt_c && c_gt_b) s = 1;
          else if (c_gt_a && a_gt_b) s = 2;
          else if (c_gt_b && b_gt_a) s = 3;
          else if (b_gt_c && c_gt_a) s = 4;
          else if (b_gt_a && a_gt_c) s = 5;
          else s=-1;


          const float HYS = 0.5f;  // hysteresis band around 0, tune this

          static bool ah = false, bh = false, ch = false;

          // A
          if (!ah && a >  HYS)      ah = true;
          else if (ah && a < -HYS)  ah = false;

          // B
          if (!bh && b >  HYS)      bh = true;
          else if (bh && b < -HYS)  bh = false;

          // C
          if (!ch && c >  HYS)      ch = true;
          else if (ch && c < -HYS)  ch = false;

          uint8_t pattern = (ah ? 1 : 0) | (bh ? 2 : 0) | (ch ? 4 : 0);

          int new_phase = id(phase);  // default: keep old

          switch (pattern) {
            case 0b100: new_phase = 0; break;
            case 0b110: new_phase = 1; break;
            case 0b010: new_phase = 2; break;
            case 0b011: new_phase = 3; break;
            case 0b001: new_phase = 4; break;
            case 0b101: new_phase = 5; break;
            // anything else: invalid/transient → ignore
            default: new_phase = -1; break;
          }

          float pn[3] = {2*a - b - c, 2*b - a - c, 2*c - a - b};
          if ((id(phase) & 1) == 0)
            for (int k = 0; k < 3; ++k) pn[k] = -pn[k];
          int idx = (id(phase) + 2) % 3;  // candidate phase

          ESP_LOGD("phase", "prev_phase:%i cand_phase:%i alt_phase:%i est_phase:%i pn:%f %f %f", id(phase), idx, s, new_phase, pn[0], pn[1], pn[2]);

          uint32_t current_time = millis();
          float flow_rate = 0.0f;  
          float liters_for_phase = 1.0f / 6.0f;
          
          // TODO: consider calibrating relative duration of the phases based on typical flow patterns, 
          // e.g. if phase 0 is typically shorter than others, it might indicate a faster flow and 
          // thus more liters per phase change.

          // Simple flow rate calculation based on time since last phase change
          if (id(last_flow_time) > 0) {
            flow_rate = (liters_for_phase * 60000.0) / float(current_time - id(last_flow_time));
          }

          if (pn[idx]+0.1 < pn[(idx + 1) % 3] && pn[idx]+0.1 < pn[(idx + 2) % 3] ) {
              id(phase)=(id(phase)+1)%6;

              id(consumption_lifetime) += liters_for_phase;
              id(consumption_since_restart) += liters_for_phase;
              id(consumption_current) += liters_for_phase;
              
              if (id(flow_rate_current) == 0.0f) {
                id(flow_rate_current) = flow_rate;
              } else {
                id(flow_rate_current) = 0.7f * id(flow_rate_current) + 0.3f * flow_rate;
              }
              
              id(last_flow_time) = current_time;
          } else {

            // Auto-reset consumption after reset_current_time seconds of no flow
            // or when flow drops to reset_fraction of current flow rate.
            if ( millis() - id(last_flow_time) >= ${reset_current_time} ||
                  flow_rate < id(flow_rate_current) * ${reset_fraction} )
            {
              if (id(consumption_current) != 0.0f) {
                id(consumption_previous) = id(consumption_current);
                id(flow_rate_previous) = id(flow_rate_current);
              }
              
              id(consumption_current) = 0.0f;
              id(flow_rate_current) = 0.0f;
            }
          }
          
          ESP_LOGD("results", "consumption_lifetime:%f consumption_since_restart:%f consumption_current:%f consumption_previous:%f flow_rate_current:%f flow_rate_previous:%f", 
            id(consumption_lifetime), id(consumption_since_restart), id(consumption_current), id(consumption_previous), id(flow_rate_current), id(flow_rate_previous));


# Triggers reading adc values and iterating algoritm.
# Publish sensor states at the configured update interval or immediately if fastupdate is enabled.
# Also publishes a debug JSON with all relevant values when debug mode is enabled.
interval:
  - interval: ${sample_interval}
    then:
      - script.execute: update_readings
      - if:
          condition:
            any:
              - switch.is_on: fastupdate
              - lambda: "return (millis() - id(last_publish_time)) >= id(update_interval).state * 1000;"
          then:
            - lambda: |-
                // Force update sensors so it gets new values
                id(consumption_lifetime_number).publish_state(id(consumption_lifetime));
                id(consumption_lifetime_sensor).publish_state(id(consumption_lifetime));
                id(consumption_since_restart_sensor).publish_state(id(consumption_since_restart));
                id(consumption_current_sensor).publish_state(id(consumption_current));
                id(consumption_previous_sensor).publish_state(id(consumption_previous));
                id(flow_rate_current_sensor).publish_state(id(flow_rate_current));
                id(flow_rate_previous_sensor).publish_state(id(flow_rate_previous));

                id(min_a).publish_state(id(min_a).state);
                id(min_b).publish_state(id(min_b).state);
                id(min_c).publish_state(id(min_c).state);
                id(max_a).publish_state(id(max_a).state);
                id(max_b).publish_state(id(max_b).state);
                id(max_c).publish_state(id(max_c).state);

                id(last_publish_time) = millis();
            - if:
                condition:
                  switch.is_on: debugmodus
                then:
                  - lambda: |-
                      char json[256];

                      snprintf(
                        json, sizeof(json),
                        "{"
                          "\"time\":%d,"
                          "\"al\":%.3f,\"bl\":%.3f,\"cl\":%.3f,"
                          "\"ad\":%.3f,\"bd\":%.3f,\"cd\":%.3f,"
                          "\"ami\":%.3f,\"bmi\":%.3f,\"cmi\":%.3f,"
                          "\"ama\":%.3f,\"bma\":%.3f,\"cma\":%.3f,"
                          "\"phs\":%d,"
                          "\"tot\":%.2f,\"res\":%.2f,\"cur\":%.2f,\"prv\":%.2f,"
                          "\"flw_cur\":%.2f,\"flw_prv\":%.2f"
                        "}"
                        ,millis()
                        ,id(light_sensor_a_light).state, id(light_sensor_b_light).state, id(light_sensor_c_light).state
                        ,id(light_sensor_a_dark).state, id(light_sensor_b_dark).state, id(light_sensor_c_dark).state
                        ,id(min_a).state, id(min_b).state, id(min_c).state
                        ,id(max_a).state, id(max_b).state, id(max_c).state
                        ,id(phase)
                        ,id(consumption_lifetime), id(consumption_since_restart)
                        ,id(consumption_current), id(consumption_previous)
                        ,id(flow_rate_current), id(flow_rate_previous)
                      );

                      ESP_LOGI("debug_json", "Publishing debug json: %s", json);
                      id(debug_json).publish_state(json);
                else:
                  - lambda: |-
                      id(debug_json).publish_state("");
