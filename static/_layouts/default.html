<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="/img/muino_logo.png">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --link: #0b5cad;
      --code-bg: #f3f4f6;
      --esp-tools-button-color: #0b5cad;
      --esp-tools-button-text-color: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #e6edf3;
        --muted: #9198a1;
        --border: #30363d;
        --link: #58a6ff;
        --code-bg: #161b22;
        --esp-tools-button-color: #2f81f7;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    a { color: var(--link); }
    .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
    header { border-bottom: 1px solid var(--border); }
    header .wrap { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-top: 18px; padding-bottom: 14px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; color: var(--text); text-decoration: none; }
    nav a { margin-left: 18px; color: var(--muted); text-decoration: none; font-size: 15px; }
    nav a:first-child { margin-left: 0; }
    nav a:hover { color: var(--link); }
    nav a.active { color: var(--text); font-weight: 600; }
    main { padding: 8px 0 48px; }
    h1 { font-size: 30px; line-height: 1.25; margin: 32px 0 16px; }
    h2 { font-size: 22px; margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    h3 { font-size: 18px; margin: 28px 0 8px; }
    h4 { font-size: 16px; margin: 24px 0 8px; }
    img { max-width: 100%; height: auto; }
    img.center { display: block; margin: 20px auto; }
    code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 90%; }
    pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
    pre code { padding: 0; background: none; }
    li { margin: 4px 0; }
    esp-web-install-button { display: inline-block; margin: 8px 0 4px; }
    .lead { font-size: 18px; color: var(--muted); margin: 0 0 24px; }
    .lead strong { color: var(--text); }
    .hero { display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: center; margin: 8px 0 16px; }
    .hero img { width: 100%; border-radius: 8px; }
    .install-box { border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
    .install-box h2 { margin: 0 0 8px; padding: 0; border: 0; font-size: 19px; }
    .install-box p { margin: 0 0 8px; }
    .small { font-size: 14px; color: var(--muted); }
    @media (max-width: 600px) {
      .hero { grid-template-columns: 1fr; }
      .hero img { max-width: 260px; margin: 0 auto; }
    }
    footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
    footer .wrap { padding-top: 16px; padding-bottom: 24px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/"><img src="/img/muino_logo.png" alt="" width="28" height="28"> Muino Water Meter Reader</a>
      <nav>
        <a href="/installation/"{% if page.url == '/installation/' %} class="active"{% endif %}>Installation</a>
        <a href="/meters/"{% if page.url == '/meters/' %} class="active"{% endif %}>Supported meters</a>
        <a href="https://muino.nl/product/smart-water-meter-reader">Webshop</a>
        <a href="https://github.com/martijnvwezel/watermeter-esphome/wiki">Unsupported sensors</a>
        <a href="https://github.com/martijnvwezel/watermeter-esphome">GitHub</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      {{ content }}
    </div>
  </main>
  <footer>
    <div class="wrap">
      <a href="https://muino.nl">muino.nl</a> · Firmware built with <a href="https://esphome.io">ESPHome</a> and installed with <a href="https://esphome.github.io/esp-web-tools/">ESP Web Tools</a>
    </div>
  </footer>
</body>
</html>
